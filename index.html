<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <h3>Command Center</h3>
        <div id="dns-status">DNS Shield: Инициализация...</div>
        <ul id="sidebar-menu">
            <li class="menu-item active" data-tab="editor" tabindex="0">Код (Monaco)</li>
            <li class="menu-item" data-tab="vm" tabindex="0">Виртуализация (v86)</li>
            <li class="menu-item" data-tab="admin" tabindex="0">Админ-панель</li>
        </ul>
        <button id="btn-devtools" onclick="toggleDevTools()">🛠 Открыть DevTools [F12]</button>
    </div>

    <div class="main">
        <!-- Редактор кода -->
        <div id="editor" class="tab-content active">
            <div class="editor-toolbar">
                <label for="language-select">Язык:</label>
                <select id="language-select" onchange="changeLanguage(this.value)">
                    <option value="rust">Rust (.rs)</option>
                    <option value="cpp">C++ (.cpp)</option>
                    <option value="c">C (.c)</option>
                    <option value="csharp">C# (.cs)</option>
                    <option value="javascript">JavaScript (.js)</option>
                </select>
            </div>
            <div id="editor-container"></div>
        </div>

        <!-- Менеджер виртуалки и ISO -->
        <div id="vm" class="tab-content">
            <h2>ISO Manager & v86 Engine</h2>
            <input type="file" id="iso-input" accept=".iso">
            <div id="screen-container"></div>
        </div>

        <!-- Админка -->
        <div id="admin" class="tab-content">
            <h2>Системная панель</h2>
            <div id="admin-output"></div>
        </div>
    </div>

    <!-- Встроенный DevTools (Консоль и Инспектор) -->
    <div id="devtools-panel" class="devtools-hidden">
        <div class="devtools-header">
            <span>DevTools Console & REPL</span>
            <button onclick="toggleDevTools()">✕</button>
        </div>
        <div id="devtools-logs"></div>
        <div class="devtools-input-area">
            <span>&gt;</span>
            <input type="text" id="devtools-input" placeholder="Введите JS команду..." onkeydown="handleDevToolsExec(event)">
        </div>
    </div>

    <!-- Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <!-- Скрипты -->
    <script src="js/dns_bridge.js"></script>
    <script src="js/app.js"></script>
    <script src="js/features.js"></script>
    <script src="js/admin-panel.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const statusDiv = document.getElementById('dns-status');
            const testResolve = await dnsShield.resolve('github.com');
            if (testResolve) {
                statusDiv.innerText = `DNS Shield: Активен (${testResolve})`;
                statusDiv.style.color = '#4ade80';
            } else {
                statusDiv.innerText = 'DNS Shield: Ошибка';
                statusDiv.style.color = '#f87171';
            }
        });
    </script>
</body>
</html>

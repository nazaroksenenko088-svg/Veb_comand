<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <h3>Command Center</h3>
        <div id="dns-status">DNS Shield: Инициализация...</div>
        <ul>
            <li onclick="switchTab('editor')">Код (Monaco)</li>
            <li onclick="switchTab('vm')">Виртуализация (v86)</li>
            <li onclick="switchTab('admin')">Админ-панель</li>
        </ul>
    </div>

    <div class="main">
        <!-- Редактор кода -->
        <div id="editor" class="tab-content active">
            <div id="editor-container" style="height: 90vh;"></div>
        </div>

        <!-- Менеджер виртуалки и ISO -->
        <div id="vm" class="tab-content">
            <h2>ISO Manager & v86 Engine</h2>
            <input type="file" id="iso-input" accept=".iso">
            <div id="screen-container"></div>
        </div>

        <!-- Админка -->
        <div id="admin" class="tab-content">
            <h2>Системная панель</h2>
            <div id="admin-output"></div>
        </div>
    </div>

    <!-- Подключаем Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <!-- Скрипты ядра и модули -->
    <script src="js/dns_bridge.js"></script>
    <script src="js/app.js"></script>
    <script src="js/features.js"></script>
    <script src="js/admin-panel.js"></script>

    <script>
        // Инициализация DNS после загрузки
        document.addEventListener('DOMContentLoaded', async () => {
            const statusDiv = document.getElementById('dns-status');
            const testResolve = await dnsShield.resolve('github.com');
            if (testResolve) {
                statusDiv.innerText = `DNS Shield: Активен (${testResolve})`;
                statusDiv.style.color = '#4ade80';
            } else {
                statusDiv.innerText = 'DNS Shield: Ошибка';
                statusDiv.style.color = '#f87171';
            }
        });
    </script>
</body>
</html>

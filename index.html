<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polygon Web OS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Рабочий стол / контейнер для окон -->
    <div id="custom-ui-container">
        <!-- Панель задач / Меню запуска -->
        <div class="taskbar">
            <button id="run-btn" class="taskbar-btn">🖥️ Запустить Linux VM</button>
            <button id="admin-btn" class="taskbar-btn">⚙️ Админ-панель</button>
        </div>
    </div>

    <!-- Подключаем библиотеку эмулятора v86 через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/v86@0.3/build/libv86.js"></script>
    
    <!-- Подключаем наши скрипты -->
    <script src="admin-panel.js"></script>
    <script src="features.js"></script>
    <script src="app.js"></script>
</body>
</html>
